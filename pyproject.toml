[project]
name = "tirex-2"
version = "0.2.1"
description = "TiRex-2 time series forecasting inference"
authors = [
	{ name = "NXAI" }
]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
	"torch>=2.8.0",
	"torch>=2.10.0; python_version >= '3.14'",
	"numpy>=2.1.3",
	"numpy>=2.3.3; python_version >= '3.14'",
	"einops~=0.8.1",
	"flashrnn>=1.0.5",
	"xlstm~=2.0.3",
	"PyYAML>=6",
	"huggingface-hub>=0.35.3",
]

[project.optional-dependencies]
examples = [
	"matplotlib>=3.10.0",
	"plotly",
	"jupyterlab",
]

fev = [
	"fev",
	"datasets>=4.4.0,<5",
	"pyarrow>=22.0.0",
]

gluonts = [
	"gluonts>=0.16.2",
	"pandas~=2.3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Pixi
[tool.pixi.workspace]
channels = ["conda-forge", "pytorch"]
platforms = [
  # cuda platforms are listed first, so they win platform selection on a machine with a CUDA driver.
  { name = "linux-64-cuda", platform = "linux-64", cuda = "13.0" },
  { name = "win-64-cuda", platform = "win-64", cuda = "13.0" },
  { name = "linux-64-cuda-132", platform = "linux-64", cuda = "13.2" },
  { name = "win-64-cuda-132", platform = "win-64", cuda = "13.2" },
  { name = "linux-64-cuda-126", platform = "linux-64", cuda = "12.6" },
  { name = "win-64-cuda-126", platform = "win-64", cuda = "12.6" },
  { name = "linux-64-cpu", platform = "linux-64" },
  { name = "win-64-cpu", platform = "win-64" },
  { name = "osx-arm64", platform = "osx-arm64" },
]

[tool.pixi.pypi-dependencies]
tirex-2 = { path = ".", editable = true }
# resolve torch (cuda) for cuda platforms
torch = { version = "*", index = "https://download.pytorch.org/whl/cu130" }

[tool.pixi.target."*-cuda-132".pypi-dependencies]
# resolve torch (cuda) for cuda platforms
torch = { version = "*", index = "https://download.pytorch.org/whl/cu132" }

[tool.pixi.target."*-cuda-126".pypi-dependencies]
# resolve torch (cuda) for cuda platforms
torch = { version = "*", index = "https://download.pytorch.org/whl/cu126" }

[tool.pixi.target.osx.pypi-dependencies]
# resolve torch (cpu) for macOS platforms
torch = { version = "*", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.environments]
default = []
test = ["test"]
examples = ["examples"]
pypi-build = ["pypi-build"]

[tool.pixi.feature.test.pypi-dependencies]
tirex-2 = { path = ".", editable = true, extras = ["gluonts", "fev"] }
pytest = "*"

[tool.pixi.feature.examples.pypi-dependencies]
tirex-2 = { path = ".", editable = true, extras = ["examples", "gluonts", "fev"] }
toolz = ">=0.12.1"

[tool.pixi.tasks]
test = { cmd = "pytest test/", default-environment = "test" }
notebook = { cmd = "jupyter lab examples/getting_started.ipynb", default-environment = "examples" }
# benchmarking tasks:
# requires the path to the gifteval storage and a model type; examples/gifteval is added to PYTHONPATH for its local helper modules
gifteval = { cmd = "python examples/gifteval/run_gifteval.py", default-environment = "examples" }
# requires the path to the fev-bench storage
fevbench = { cmd = "python examples/fevbench/run_fevbench.py", default-environment = "examples" }

[tool.pixi.feature.pypi-build.dependencies]
python = ">=3.11,<3.14"

[tool.pixi.feature.pypi-build.pypi-dependencies]
build = "*"

[tool.pixi.feature.examples.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/examples/gifteval:$PYTHONPATH"

