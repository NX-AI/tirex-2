[project]
name = "tirex-2"
version = "0.2.1"
description = "TiRex-2 time series forecasting inference"
authors = [
	{ name = "NXAI" }
]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
	"torch>=2.8.0",
	"torch>=2.10.0; python_version >= '3.14'",
	"numpy>=2.1.3",
	"numpy>=2.3.3; python_version >= '3.14'",
	"einops~=0.8.1",
	"flashrnn>=1.0.5",
	"xlstm~=2.0.3",
	"PyYAML>=6",
	"huggingface-hub>=0.35.3",
	"gluonts>=0.16.3",
	"narwhals>=2.0",
]

[project.optional-dependencies]
examples = [
	"matplotlib>=3.10.0",
	"plotly",
	"jupyterlab",
]

fev = [
	"fev",
	"datasets==3.6.0",
	"pyarrow>=21.0.0",
]

gluonts = [
	"gluonts>=0.16.2",
	"pandas~=2.2.3",
]

pandas = [
	"pandas~=2.2.3",
]

polars = [
	"polars>=1.0",
]

pyarrow = [
	"pyarrow>=15.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Pixi
[tool.pixi.workspace]
channels = ["conda-forge", "pytorch", "nvidia"]
platforms = ["linux-64"]

[tool.pixi.tasks]
test = { cmd = "pytest test/", default-environment = "test-cu128" }
# requires the path to the gifteval storage and a model type; examples/gifteval is added to PYTHONPATH for its local helper modules
gifteval = { cmd = "python examples/gifteval/run_gifteval.py", default-environment = "example-cu128" }
# requires the path to the fev-bench storage
fevbench = { cmd = "python examples/fevbench/run_fevbench.py", default-environment = "example-cu128" }
notebook = { cmd = "jupyter lab examples/getting_started.ipynb", default-environment = "example-cu128" }

[tool.pixi.environments]
default = ["cuda128", "runtime"]
cuda128 = ["cuda128", "runtime"]
cuda126 = ["cuda126", "runtime"]
example = ["cpu", "example"]
example-cu128 = ["cuda128", "example"]
example-cu126 = ["cuda126", "example"]
test-cu128 = ["cuda128", "test"]
test-cu126 = ["cuda126", "test"]
test-cpu = ["cpu", "test"]
pypi-build = ["pypi-build"]

[tool.pixi.feature.pypi-build.dependencies]
python = ">=3.11,<3.14"

[tool.pixi.feature.pypi-build.pypi-dependencies]
build = "*"

[tool.pixi.feature.runtime.pypi-dependencies]
tirex-2 = { path = ".", editable = true }

[tool.pixi.feature.test.pypi-dependencies]
pytest = "*"
tirex-2 = { path = ".", editable = true, extras = ["gluonts", "fev", "polars", "pyarrow"] }

[tool.pixi.feature.example.pypi-dependencies]
tirex-2 = { path = ".", editable = true, extras = ["examples", "gluonts", "fev"] }
toolz = ">=0.12.1"

[tool.pixi.feature.example.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/examples/gifteval:$PYTHONPATH"

[tool.pixi.feature.cpu.pypi-dependencies]
torch = { version = "==2.9.1+cpu", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.feature.cpu.dependencies]
python = ">=3.11,<3.14"

[tool.pixi.feature.cuda128.pypi-dependencies]
torch = { version = "==2.9.1+cu128", index = "https://download.pytorch.org/whl/cu128" }

[tool.pixi.feature.cuda126.pypi-dependencies]
torch = { version = "==2.8.0+cu126", index = "https://download.pytorch.org/whl/cu126" }

[tool.pixi.feature.cuda128.dependencies]
python = ">=3.11,<3.14"
gxx_linux-64 = "13.2.0.*"
gcc_impl_linux-64 = "13.2.0.*"
compilers = "*"
cmake = "*"
ninja = "*"
cuda-toolkit = "12.8.*"
cuda = "12.8.*"
cuda-nvcc = "12.8.*"

[tool.pixi.feature.cuda126.dependencies]
python = ">=3.11,<3.14"
cuda = "12.6.*"
cuda-nvcc = "12.6.*"
gxx_linux-64 = "13.2.0.*"
gcc_impl_linux-64 = "13.2.0.*"
compilers = "*"
cmake = "*"
ninja = "*"
cuda-toolkit = "12.6.*"
cuda-cccl = "12.6.*"

# ruff
[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".ipynb_checkpoints",
    ".pytest_cache",
    ".ruff_cache",
    ".vscode",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "archive",
]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["I001"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
combine-as-imports = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"

# setuptools
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# pytest
[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.uv]
override-dependencies = ["triton; sys_platform == 'linux'"]