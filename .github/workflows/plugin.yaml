name: Check agent plugin

on:
  pull_request:
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.agents/plugins/**'
      - '.github/workflows/plugin.yaml'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.agents/plugins/**'
      - '.github/workflows/plugin.yaml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Claude CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.309
      - name: Check Claude CLI version
        run: claude --version
      - name: Test validator and check package
        run: |
          python -m unittest discover -s scripts/tests -p 'test_check_plugin.py'
          python scripts/check_plugin.py
      - name: Require a version bump for plugin changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_plugin.py --base "$BASE_SHA"
      - name: Validate Claude plugin and marketplace
        run: |
          claude plugin validate plugins/tirex2 --strict
          claude plugin validate .claude-plugin/marketplace.json --strict

  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Codex CLI
        run: |
          curl -fsSL https://chatgpt.com/codex/install.sh | sh -s -- --release 0.163.0
      - name: Check Codex CLI version
        run: codex --version
      - name: Install through Codex and verify cache
        run: |
          codex plugin marketplace add .
          codex plugin add tirex2@tirex2-plugins
          python scripts/check_plugin.py --cache-root "$HOME/.codex/plugins/cache/tirex2-plugins/tirex2"
