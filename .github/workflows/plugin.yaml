name: Check agent plugin

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install Claude CLI
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.309
      - name: Test validator and check package
        run: |
          python -m unittest discover -s scripts/tests -p 'test_check_plugin.py'
          python scripts/check_plugin.py
      - name: Require a version bump for plugin changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_plugin.py --base "$BASE_SHA"
      - name: Validate Claude plugin and marketplace
        run: |
          claude plugin validate plugins/tirex2 --strict
          claude plugin validate .claude-plugin/marketplace.json --strict

  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install Codex CLI
        run: |
          npm install --global @openai/codex@0.163.0
      - name: Install through Codex and verify cache
        run: |
          codex plugin marketplace add .
          codex plugin add tirex2@tirex2-plugins
          python scripts/check_plugin.py --cache-root "$HOME/.codex/plugins/cache/tirex2-plugins/tirex2"
